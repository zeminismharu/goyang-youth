# GitHub에 코드를 올릴 때마다 자동으로 빌드해서 GitHub Pages에 배포합니다.
# (코드만 올라갑니다. 사용자의 기록은 휴대폰 안에만 있고 여기로 오지 않습니다.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/goyang-youth-policy-webapp-d2eqkm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
