# Cloudflare Workers 배포
#
# 저장소 Settings → Secrets and variables → Actions 에 아래 2개를 넣으면
# 푸시할 때마다 자동 배포된다.
#   CLOUDFLARE_API_TOKEN   (Workers 배포 권한이 있는 API 토큰)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare 대시보드 우측의 Account ID)
#
# 온통청년 인증키(YOUTH_API_KEY)는 여기에 넣지 않는다.
# 빌드가 아니라 런타임에 필요하므로 Worker 시크릿으로 따로 등록한다:
#   npx wrangler secret put YOUTH_API_KEY

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/goyang-youth-policy-webapp-d2eqkm
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: OpenNext 빌드 (Cloudflare Workers용)
        run: npx opennextjs-cloudflare build

      - name: 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
